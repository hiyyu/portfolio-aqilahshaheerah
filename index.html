<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=DM+Serif+Display&family=Alice&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="images/character.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nur Aqilah Shaheerah — Home</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.name-row{position:relative;display:inline-block}
.open-sticker{position:absolute;left:100%;bottom:50%;width:clamp(270px,17vw,300px) ;pointer-events:none}
.open-sticker img{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}

/* when the drawing loads, the text stays only for screen readers */
.open-sticker:not(.nofile) span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* fallback bubble, shown only if images/open-bubble.png is missing */
.open-sticker.nofile{width:max-content;max-width:clamp(170px,24vw,340px)}
.open-sticker.nofile span{position:relative;display:block;padding:.35em .9em;font-size:clamp(13px,1.3vw,18px);
  font-weight:700;line-height:1.2;text-align:center;background:var(--bubble);color:var(--ink);
  border:3px solid #1a1a1a;border-radius:18px 22px 20px 24px}
.open-sticker.nofile span::after{content:"";position:absolute;left:14px;bottom:-14px;width:14px;height:14px;
  background:var(--bubble);border-left:3px solid #1a1a1a;border-bottom:3px solid #1a1a1a;
  transform:skewX(-35deg) rotate(-20deg)}

@keyframes openBob{to{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.open-sticker{animation:none}}
@media (max-width:700px){
  .open-sticker{left:auto;right:-14%;bottom:100%;width:clamp(130px,36vw,190px)}
}
</style>
</head>
<body>
<header id="hero">
  <div class="hero-left">
    <div class="greet">
      <p>hello, my name is..</p>
      <div class="name-row">
        <h1>Nur Aqilah Shaheerah</h1>
        <div class="open-sticker" role="note">
          <img src="images/open-bubble.png" alt=""
              onerror="this.parentNode.classList.add('nofile');this.remove()">
          <span>Open to freelance, and intern roles</span>
        </div>
      </div>
      <p>it is nice to meet you!</p>
    </div>

    <nav class="links" aria-label="Contact">
      <a href="mailto:aqilahshaheerah28@gmail.com">
        <img src="images/gmail.png" alt="Gmail Logo" class="social-icon">
        <span>Gmail</span>
      </a>
      <a href="https://www.linkedin.com/in/nur-aqilah-shaheerah-md-azhar/" target="_blank" rel="noopener">
        <img src="images/linkedin.png" alt="LinkedIn Logo" class="social-icon">
        <span>LinkedIn</span>
      </a>
      <a href="https://github.com/hiyyu" target="_blank" rel="noopener">
        <img src="images/github.png" alt="GitHub Logo" class="social-icon">
        <span>GitHub</span>
      </a>
    </nav>
  </div>

  <div class="hero-right">
    <div id="heroClover" role="button" tabindex="0" aria-label="Click the clover to open the menu">
      <div id="hcSpin"></div>
    </div>
    <div class="hhint">click my leaf!</div>
  </div>

  <div class="hs" id="hs-projects"><div class="float" data-st="projects"></div></div>
  <div class="hs" id="hs-about"><div class="float" data-st="about"></div></div>
  <div class="hs" id="hs-team"><div class="float" data-st="team"></div></div>
  <div class="hs" id="hs-skills"><div class="float" data-st="skills"></div></div>
</header>

<script>
(() => {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hcSpin = document.getElementById('hcSpin');
  const heroClover = document.getElementById('heroClover');
  const cloverSvg = document.getElementById('cloverSvg');
  function drawnClover() {
    if (!cloverSvg) return;
    const c = cloverSvg.cloneNode(true);
    c.removeAttribute('id');
    c.style.cssText = 'width:100%;height:100%;overflow:visible;display:block';
    c.querySelectorAll('.leaf').forEach(l => {
      l.removeAttribute('data-sec');
      l.setAttribute('class', 'leaf-static');
    });
    hcSpin.appendChild(c);
  }
  const image = new Image();
  image.alt = '';
  image.src = 'images/clover.png';
  image.onload = () => hcSpin.appendChild(image);
  image.onerror = drawnClover;
  let angle = 0, last = performance.now();
  function spin(now) {
    angle += Math.min(now - last, 50) * 0.012;
    last = now;
    if (!reduce) hcSpin.style.transform = 'rotate(' + angle + 'deg)';
    requestAnimationFrame(spin);
  }
  requestAnimationFrame(spin);
  function openMenu() { window.location.href = 'clover.html'; }
  heroClover.addEventListener('click', openMenu);
  heroClover.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openMenu(); }
  });
})();
</script>
</body>
</html>
